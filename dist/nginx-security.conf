# Nginx Security Headers & Confidentiality Directive Snippet
# Add to your server block in /etc/nginx/sites-available/default

# Force HTTPS Redirect
if ($scheme != "https") {
    return 301 https://$host$request_uri;
}

# Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

# Disable Directory Indexing
autoindex off;

# Restrict Access to Sensitive Data / Admin Files
location ~ /\.(git|htaccess|env) {
    deny all;
}
